name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Migrations, tests, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: quantrade_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d quantrade_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/quantrade_ci
      QUANTRADE_ENVIRONMENT: test
      RAW_ARTIFACTS_URI: file:///tmp/quantrade-ci/raw
      SEC_USER_AGENT: Quantrade CI ci@example.invalid
      MARKET_DATA_PROVIDER: alpaca
      APCA_API_KEY_ID: ci-placeholder
      APCA_API_SECRET_KEY: ci-placeholder
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: services/research/pyproject.toml

      - name: Install research service
        run: python -m pip install --disable-pip-version-check -e services/research

      - name: Verify clean database migrations
        run: python -m quantrade_research.verify_migrations

      - name: Run research tests
        run: python -m unittest discover -s services/research/tests

      - name: Lint web application
        run: pnpm lint:web

      - name: Build production web application
        run: pnpm build:web
